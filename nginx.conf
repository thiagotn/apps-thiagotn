worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; server_tokens off;

    # Redirects relativos: o nginx escuta em :8080 atrás do Traefik (que recebe do túnel). Sem
    # isto, qualquer redirect vazaria a porta interna no Location (http://host:8080/...), e o
    # browser tentaria abrir uma porta que não existe do lado de fora.
    absolute_redirect off;
    port_in_redirect off;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    log_format main '$remote_addr - $status "$request" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Um host só: apps.thiagotn.com é um subdomínio, não há "www" para redirecionar.
    server {
        listen 8080 default_server;
        server_name apps.thiagotn.com _;
        root /usr/share/nginx/html;
        index index.html;

        # Headers de segurança no nível do server. O nginx só os herda em locations que não
        # tenham add_header próprio — por isso o cache abaixo usa `expires`, nunca add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Bundles do Astro: o nome carrega hash do conteúdo, então nunca mudam de conteúdo.
        location ^~ /_astro/ { expires 1y; access_log off; try_files $uri =404; }

        # Thumbnails e demais assets — trocam só quando o screenshot é refeito.
        location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # HTML sem cache agressivo: muda a cada deploy, e é a porta de entrada.
        location ~* \.(html|xml|json)$ { expires -1; }
        location = / { expires -1; try_files /index.html =404; }

        location = /robots.txt  { access_log off; }
        location = /sitemap.xml { }

        # 404 de verdade (status 404). `try_files ... /404.html` devolveria 200 com a
        # página de erro, o que engana buscador e monitoramento.
        error_page 404 /404.html;
        location = /404.html { internal; }

        location / { try_files $uri $uri/ =404; }
    }
}
